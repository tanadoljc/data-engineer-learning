<p>This is my first Angular App</p>

<h1>{{title}}</h1>

<button [disabled]="isDisabled" (click)="onClick()">Toggle</button>
<!-- There also has [()] for binding 2 ways such as input -->

<h2>Count: {{count()}}</h2>
<h2>Double: {{double()}}</h2>

<button (click)="addValue()">+</button>
<button (click)="minusValue()">-</button>
<button (click)="resetValue()">reset</button>
